<button
  type="button"
  class="likeButton"
  [class.liked]="liked()"
  (click)="toggleLike()"
  [disabled]="busy()"
  aria-label="Like post"
  [attr.aria-pressed]="liked()"
  [attr.aria-describedby]="'likes-count-' + post._id"
>
  <mat-icon class="likeButton__icon">
    {{ liked() ? 'favorite' : 'favorite_border' }}
  </mat-icon>
  <small class="likeButton__count" [id]="'likes-count-' + post._id">
    {{ likesCount() }}<span class="cdk-visually-hidden">{{ likesCount() === 1 ? ' like' : ' likes' }}</span>
  </small>
</button>
