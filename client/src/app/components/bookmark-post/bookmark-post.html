<button
  type="button"
  class="bookmarkButton"
  [class.bookmarked]="bookmarked()"
  (click)="toggleBookmark()"
  [disabled]="busy()"
  aria-label="Bookmark post"
  [attr.aria-pressed]="bookmarked()"
>
  <mat-icon class="bookmarkButton__icon">
    {{ bookmarked() ? 'bookmark' : 'bookmark_border' }}
  </mat-icon>
</button>
