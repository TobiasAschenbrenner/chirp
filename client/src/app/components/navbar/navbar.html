<header class="navbar" [class.navbar--search-open]="mobileSearchOpen()">
  <button
    type="button"
    class="navbar__backdrop"
    *ngIf="open()"
    aria-label="Close search results"
    (click)="close()"
  ></button>

  <div class="container navbar__container">
    <a routerLink="/home" class="navbar__logo">CHIRP</a>

    <button
      #mobileSearchToggle
      type="button"
      class="navbar__searchToggle"
      aria-label="Open search"
      aria-controls="user-search-form"
      [attr.aria-expanded]="mobileSearchOpen()"
      (click)="openMobileSearch()"
    >
      <mat-icon aria-hidden="true">search</mat-icon>
    </button>

    <div class="navbar__searchWrap">
      <button
        type="button"
        class="navbar__searchBack"
        aria-label="Close search"
        (click)="dismissSearch()"
      >
        <mat-icon aria-hidden="true">arrow_back</mat-icon>
      </button>

      <form
        id="user-search-form"
        class="navbar__search"
        role="search"
        aria-label="Users"
        (submit)="$event.preventDefault()"
      >
        <input
          #userSearch
          type="search"
          aria-label="Search users"
          [formControl]="search"
          placeholder="Search"
          (focus)="open.set(true)"
          autocomplete="off"
          (keydown.escape)="dismissSearch()"
        />
        <button type="button" aria-label="Search" (click)="userSearch.focus(); open.set(true)">
          <mat-icon>search</mat-icon>
        </button>
      </form>

      <p class="cdk-visually-hidden" role="status">{{ searchStatus }}</p>

      <div class="navbar__searchResults" *ngIf="open()">
        <div class="navbar__searchLoading" *ngIf="searching()">Searching…</div>

        <button
          type="button"
          class="navbar__searchItem"
          *ngFor="let u of results()"
          (click)="goToUser(u._id)"
          (keydown.escape)="dismissSearch()"
        >
          <app-profile-image *ngIf="u.profilePhoto" [src]="u.profilePhoto" size="sm" />
          <span class="navbar__searchName">{{ u.fullName }}</span>
        </button>

        <div class="navbar__searchEmpty" *ngIf="showEmptyState">No users found</div>
      </div>
    </div>

    <div class="navbar__right">
      <a
        *ngIf="auth.getUserId() as userId"
        [routerLink]="['/users', userId]"
        class="navbar__profile"
        aria-label="Profile"
      >
        <app-profile-image
          *ngIf="user()?.profilePhoto"
          [src]="user()!.profilePhoto ?? ''"
          size="sm"
        ></app-profile-image>
      </a>

      <button *ngIf="auth.isLoggedIn()" type="button" class="linkish" (click)="logout()">
        Logout
      </button>
    </div>
  </div>
</header>
