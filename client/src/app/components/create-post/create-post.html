<form
  class="createPost"
  enctype="multipart/form-data"
  [attr.aria-busy]="loading"
  (ngSubmit)="onSubmit()"
>
  <div class="createPost__top">
    <div class="createPost__avatar">
      <app-profile-image
        *ngIf="user() as u"
        [src]="u.profilePhoto ?? ''"
        size="md"
      ></app-profile-image>
    </div>

    <div class="form__field createPost__field">
      <label for="create-post-body">Post text</label>
      <textarea
        id="create-post-body"
        name="body"
        [(ngModel)]="body"
        placeholder="What's on your mind?"
        [attr.maxlength]="validationLimits.post"
        required
        [readOnly]="loading"
      ></textarea>
    </div>
  </div>

  <div class="createPost__attachment" *ngIf="image">
    <mat-icon aria-hidden="true">image</mat-icon>
    <span>{{ image.name }}</span>
  </div>

  <div class="createPost__bottom">
    <p *ngIf="error" class="createPost__error-message" role="alert">
      <mat-icon aria-hidden="true">error_outline</mat-icon>
      <span>{{ error }}</span>
    </p>

    <div class="createPost__actions">
      <button
        type="button"
        class="icon-button"
        [attr.aria-label]="image ? 'Change image' : 'Add image'"
        [disabled]="loading"
        (click)="imageInput.click()"
      >
        <mat-icon>image</mat-icon>
      </button>

      <input
        #imageInput
        type="file"
        id="image"
        aria-label="Choose a post image"
        accept="image/png,image/jpeg,image/webp"
        hidden
        (change)="onFileChange($event)"
        [disabled]="loading"
      />

      <button type="submit" [disabled]="!canSubmit">
        {{ loading ? 'Posting…' : 'Post' }}
      </button>
    </div>
  </div>
</form>
