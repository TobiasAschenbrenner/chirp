<section class="profile">
  <div class="profile__container">
    <div class="profile__image">
      <app-profile-image *ngIf="user.profilePhoto" [src]="user.profilePhoto" size="lg" />

      <ng-container *ngIf="isOwnProfile()">
        <input
          #avatarInput
          id="avatar"
          type="file"
          accept="image/png, image/jpeg"
          aria-label="Choose a profile image"
          [disabled]="busy"
          (change)="onPickAvatar($event)"
        />

        <button
          *ngIf="!avatarTouched()"
          type="button"
          class="profile__image-edit"
          aria-label="Change avatar"
          [disabled]="busy"
          (click)="avatarInput.click()"
        >
          <mat-icon>upload</mat-icon>
        </button>

        <button
          *ngIf="avatarTouched()"
          type="button"
          class="profile__image-btn"
          (click)="submitAvatar()"
          [disabled]="busy"
          aria-label="Save avatar"
        >
          <mat-icon>check</mat-icon>
        </button>
      </ng-container>
    </div>

    <h4 class="profile__name">{{ user.fullName }}</h4>

    <ul class="profile__follows">
      <li>
        <h4>{{ followingCount() }}</h4>
        <small>Following</small>
      </li>
      <li>
        <h4>{{ followerCount() }}</h4>
        <small>Followers</small>
      </li>
    </ul>

    <div class="profile__actions-wrapper">
      <button
        *ngIf="isOwnProfile()"
        type="button"
        class="btn"
        (click)="onEditProfile()"
        [disabled]="busy"
      >
        Edit profile
      </button>

      <button
        *ngIf="!isOwnProfile()"
        type="button"
        class="btn dark"
        (click)="onFollowToggle()"
        [disabled]="busy"
      >
        {{ followsUser() ? 'Unfollow' : 'Follow' }}
      </button>
    </div>

    <article class="profile__bio" *ngIf="user.bio">
      <p>{{ user.bio }}</p>
    </article>
  </div>
</section>
