<section class="bookmarks" [attr.aria-busy]="loading()">
  <h1 class="bookmarks__title" tabindex="-1">Bookmarks</h1>

  <p *ngIf="error()" class="error" role="alert">{{ error() }}</p>

  <app-feed-skeleton *ngIf="loading()" [count]="3"></app-feed-skeleton>

  <ng-container *ngIf="!loading()">
    <p class="center" *ngIf="isEmpty()">No posts bookmarked</p>

    <app-feeds
      *ngIf="hasBookmarks()"
      [posts]="bookmarks()"
      [bookmarkedIds]="bookmarkedIds()"
      (bookmarkChanged)="onBookmarkChanged($event)"
    ></app-feeds>
  </ng-container>
</section>
