<section class="singlePost" [attr.aria-busy]="loading()">
  <h1 class="cdk-visually-hidden" tabindex="-1">Post</h1>
  <p *ngIf="loading()" role="status">Loading…</p>
  <p *ngIf="error()" class="error" role="alert">{{ error() }}</p>

  <ng-container *ngIf="post() as p">
    <a
      class="singlePost__author feed__header"
      *ngIf="authorId() as uid"
      [routerLink]="['/users', uid]"
      [attr.aria-label]="'Open ' + (creator()?.fullName || 'User') + '’s profile'"
    >
      <app-profile-image
        *ngIf="creator()?.profilePhoto"
        [src]="creator()!.profilePhoto"
        size="md"
      ></app-profile-image>

      <div class="feed__header-details">
        <p class="feed__name">{{ creator()?.fullName || 'User' }}</p>
        <small>{{ p.createdAt | timeAgo }}</small>
      </div>
    </a>

    <div class="feed__body">
      <p>{{ p.body }}</p>
      <div class="feed__images">
        <img *ngIf="p.image" [src]="p.image" alt="Post image" decoding="async" />
      </div>
    </div>

    <footer class="feed__footer">
      <div class="feed__footer-left">
        <button
          type="button"
          class="feed__action"
          aria-label="Comments"
          aria-controls="post-reply"
          aria-describedby="comments-count"
          (click)="replyInput.focus()"
        >
          <mat-icon>chat_bubble_outline</mat-icon>
          <small id="comments-count">
            {{ comments().length }}<span class="cdk-visually-hidden">{{ comments().length === 1 ? ' comment' : ' comments' }}</span>
          </small>
        </button>
      </div>

      <div class="feed__footer-right">
        <app-bookmark-post
          [postId]="p._id"
          [initialBookmarked]="usersApi.isBookmarked(p._id)"
        ></app-bookmark-post>
      </div>
    </footer>

    <div class="singlePost__comments">
      <form class="singlePost__comments-form" (ngSubmit)="createComment()">
        <textarea
          #replyInput
          id="post-reply"
          aria-label="Reply"
          placeholder="Post your reply"
          name="comment"
          [ngModel]="commentText()"
          (ngModelChange)="commentText.set($event)"
          [attr.maxlength]="validationLimits.comment"
        ></textarea>

        <button class="singlePost__comments-btn" type="submit" aria-label="Send">
          <mat-icon>send</mat-icon>
        </button>
      </form>

      <ul class="singlePost__comment-list" aria-label="Comments" *ngIf="comments().length">
        <li *ngFor="let c of comments()">
          <app-post-comment [comment]="c" (delete)="deleteComment($event)"></app-post-comment>
        </li>
      </ul>
    </div>
  </ng-container>
</section>
