<section class="forest">
  <app-create-post
    [error]="error()"
    [loading]="posting()"
    (createPost)="createPost($event)"
  ></app-create-post>

  <app-for-you-or-following
    [active]="mode()"
    (modeChange)="onModeChange($event)"
  ></app-for-you-or-following>

  <app-feed-skeleton *ngIf="loading()" [count]="3"></app-feed-skeleton>

  <ng-container *ngIf="!loading()">
    <p class="center" *ngIf="posts().length < 1 && !feedError()">No posts found</p>

    <app-feeds
      *ngIf="posts().length > 0"
      [posts]="posts()"
      (postUpdated)="onPostUpdated($event)"
      (postDeleted)="onPostDeleted($event)"
    ></app-feeds>

    <div
      class="forest__feed-error"
      [class.forest__feed-error--empty]="!hasMore()"
      *ngIf="feedError()"
    >
      <mat-icon *ngIf="!hasMore()" aria-hidden="true">wifi_off</mat-icon>
      <p role="alert">
        <mat-icon *ngIf="hasMore()" aria-hidden="true">error_outline</mat-icon>
        <span>{{ feedError() }}</span>
      </p>
      <button type="button" class="btn forest__retry" (click)="retryPosts()">
        <mat-icon aria-hidden="true">refresh</mat-icon>
        Try again
      </button>
    </div>

    <div class="forest__pagination" *ngIf="hasMore() && !feedError()" aria-live="polite">
      <button
        type="button"
        class="btn"
        [disabled]="loadingMore()"
        [attr.aria-busy]="loadingMore()"
        (click)="loadMorePosts()"
      >
        {{ loadingMore() ? 'Loading…' : 'Load more' }}
      </button>
    </div>
  </ng-container>
</section>
